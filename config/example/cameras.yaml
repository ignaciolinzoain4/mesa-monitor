# Cámaras del local. Copiar a config/local/cameras.yaml y completar.
# Las credenciales NO van acá: se toman del .env con ${VARIABLE}.
# Marcas, plantillas y fuentes posibles: ver "Conectar cualquier sistema de cámaras" en README.md.

connections:
  # Grabador (NVR/DVR). preset: dahua (por defecto), amcrest, intelbras, hikvision, ezviz,
  # uniview, reolink, tapo u onvif. Para otra marca, usar url_template.
  nvr:
    preset: dahua
    host: ${NVR_HOST}
    port: ${NVR_PORT:-554}
    user: ${NVR_USER}
    password: ${NVR_PASSWORD}
    # url_template: "rtsp://{user}:{password}@{host}:{port}/cam/realmonitor?channel={channel}&subtype={subtype}"

  # Ejemplo: cámara IP Hikvision conectada directo (no por el NVR). Agregar CAM10_* al .env.
  # galeria_ip:
  #   preset: hikvision
  #   host: ${CAM10_HOST}
  #   user: ${CAM10_USER}
  #   password: ${CAM10_PASSWORD}

cameras:
  - id: salon-1
    name: Salón principal (fondo)
    channel: 1
    fps_detection: 3
    # Resolución esperada del stream secundario (ancho, alto). Se avisa si no coincide.
    expected_resolution: [704, 480]

  - id: salon-2
    name: Salón principal (entrada)
    channel: 2

  - id: galeria
    name: Galería sillones
    channel: 5
    enabled: false

  # Cámara con su propia URL (cualquier fuente de go2rtc):
  # - id: patio
  #   name: Patio
  #   source: "rtsp://${CAM11_USER}:${CAM11_PASSWORD}@${CAM11_HOST}:554/stream2"
  #   source_main: "rtsp://${CAM11_USER}:${CAM11_PASSWORD}@${CAM11_HOST}:554/stream1"

  # Cámara simulada para probar sin cámaras reales:
  # - id: prueba
  #   name: Cámara de prueba
  #   source: "ffmpeg:virtual?video=testsrc&size=704x480#video=h264"
