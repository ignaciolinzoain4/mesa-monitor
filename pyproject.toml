[project]
name = "mesa-monitor"
version = "0.1.0"
description = "Monitoreo de tiempos y estados de mesas por cámaras"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "fastapi==0.146.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "pyyaml==6.0.3",
    "sqlalchemy[asyncio]==2.1.5",
    "tzdata==2026.5",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
# Dependencias pesadas de visión (torch, rfdetr, trackers). Solo las instala el worker.
vision = []

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mesa_monitor"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]
extend-exclude = ["dashboard", "client"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "N", "C4", "PT"]
ignore = [
    "RUF001", # strings en español con caracteres "ambiguos"
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["N999", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mesa_monitor"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["db: test que necesita PostgreSQL (TEST_DATABASE_URL)"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pip-licenses==5.5.5",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
    "types-pyyaml==6.0.12.20260906",
]
