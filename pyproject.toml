[project]
name = "mesa-monitor"
version = "0.1.0"
description = "Monitoreo de tiempos y estados de mesas por cámaras"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "asyncpg==0.32.0",
    "fastapi==0.146.0",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "psutil==7.2.2",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "pyjwt==2.15.1",
    "pyyaml==6.0.3",
    "sqlalchemy[asyncio]==2.1.5",
    "tzdata==2026.5",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
# Dependencias pesadas de visión. Solo las instala el worker, junto con UNA variante de torch:
#   uv sync --extra vision --extra cpu     (CPU; en macOS usa MPS si está disponible)
#   uv sync --extra vision --extra cuda    (NVIDIA, CUDA 12.6: GTX 10xx a RTX 40xx)
vision = ["rfdetr==1.11.2", "trackers==2.6.1"]
cpu = ["torch==2.14.1", "torchvision==0.29.1"]
cuda = ["torch==2.14.1", "torchvision==0.29.1"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mesa_monitor"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu126", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu126", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools", "client/src"]
extend-exclude = ["dashboard"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "N", "C4", "PT"]
ignore = [
    "S101", # assert solo para invariantes internas / narrowing de tipos
    "RUF001", # strings en español con caracteres "ambiguos"
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501", "SIM117"]
"migrations/**" = ["N999", "E501"]
"src/mesa_monitor/api/metrics_service.py" = ["E501"]  # SQL
"tools/evaluate.py" = ["E501"]  # tabla del reporte
# Cliente: nombres de errores en español a propósito; compatible con Python 3.10 (sin StrEnum)
"client/**" = ["N818", "UP042", "UP007"]
"client/tests/**" = ["S101", "E501", "PT011", "S105"]
"client/examples/**" = ["E501", "T201", "S104"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mesa_monitor", "mesa_monitor_client"]
mypy_path = "src:client/src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "rfdetr", "rfdetr.*", "trackers", "trackers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "client/tests"]
pythonpath = ["src", ".", "client/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["db: test que necesita PostgreSQL (TEST_DATABASE_URL)"]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pip-licenses==5.5.5",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
    "types-psutil==7.2.2.20260906",
    "types-pyyaml==6.0.12.20260906",
]
