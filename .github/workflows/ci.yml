name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, tipos, tests, licencias)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: mesa
          POSTGRES_PASSWORD: mesa
          POSTGRES_DB: mesa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mesa -d mesa_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://mesa:mesa@localhost:5432/mesa_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --frozen --extra vision --extra cpu
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -q
      - name: Chequeo de licencias (falla con GPL/AGPL/LGPL/PML)
        run: uv run python tools/check_licenses.py
      - name: JSON Schemas de eventos al día
        run: PYTHONPATH=src uv run python tools/export_schemas.py --check

  dashboard:
    name: Dashboard (lint, tipos, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --redact --verbose --exit-code 1

  compose:
    name: Docker Compose (perfil cpu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: .env de prueba
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
      - name: Levantar el stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Health
        run: curl --fail --silent --show-error http://localhost:8000/api/v1/health
      - name: Login con el admin inicial
        run: |
          curl --fail --silent --show-error http://localhost:8000/api/v1/auth/login \
            -H 'content-type: application/json' -d '{"username":"admin","password":"cambiame"}' \
            | grep -q access_token
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
